# Cloud Mail IMAP Bridge - Dovecot configuration
# Serves Maildir mailboxes for macOS Mail

protocols = imap
listen = *, [::]
base_dir = /run/dovecot

# User/group to own mail files
mail_uid = 1000
mail_gid = 1000
first_valid_uid = 1000
last_valid_uid = 1000

# Mail location: per-user Maildir under /var/mail
mail_location = maildir:/var/mail/%u/Maildir

# Authentication
passdb {
  driver = passwd-file
  args = scheme=SHA512-CRYPT /etc/dovecot/passwd
}
userdb {
  driver = passwd-file
  args = /etc/dovecot/passwd
  default_fields = home=/var/mail/%u uid=1000 gid=1000
}

# IMAP protocol settings
protocol imap {
  mail_plugins = $mail_plugins
}

# Services
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

# SSL/TLS (provide certs in ./dovecot/certs/, or let the entrypoint generate self-signed ones)
ssl = yes
ssl_cert = </etc/dovecot/certs/cert.pem
ssl_key = </etc/dovecot/certs/key.pem
ssl_min_protocol = TLSv1.2

# Plaintext auth is only allowed over SSL/TLS.
# Port 993 uses implicit TLS; port 143 requires STARTTLS before LOGIN.
disable_plaintext_auth = yes

# Logging
log_path = /var/log/dovecot/dovecot.log
info_log_path = /var/log/dovecot/dovecot-info.log
debug_log_path = /var/log/dovecot/dovecot-debug.log

# Namespace
namespace inbox {
  inbox = yes
  separator = /
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Starred {
    auto = subscribe
  }
}
