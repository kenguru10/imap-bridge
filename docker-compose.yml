services:
  dovecot:
    build: ./dovecot
    container_name: cloud-mail-dovecot
    hostname: cloud-mail-dovecot
    ports:
      - "143:143"
      - "993:993"
    volumes:
      - maildir:/var/mail
      - ./dovecot/dovecot.conf:/etc/dovecot/dovecot.conf:ro
      - ./dovecot/passwd:/etc/dovecot/passwd:ro
      - ./dovecot/certs:/etc/dovecot/certs
    environment:
      - MAIL_UID=1000
      - MAIL_GID=1000
    networks:
      - cloud-mail-bridge
    restart: unless-stopped

  bridge:
    build: ./bridge
    container_name: cloud-mail-bridge
    environment:
      - NODE_ENV=production
    volumes:
      - maildir:/var/mail
      - ./bridge/config.json:/app/config.json:ro
      - bridge-certs:/app/certs
    ports:
      - "587:587"
    networks:
      - cloud-mail-bridge
    depends_on:
      - dovecot
    restart: unless-stopped

volumes:
  maildir:
  bridge-certs:

networks:
  cloud-mail-bridge:
    driver: bridge
